*{

body{

header{

}

header h1{

.creator{

.container{

.card{

.success{

}

.danger{
    background:#dc2626;
    color:white;
}

.gray{
    background:#e5e7eb;
}

.dayGrid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.day{
    background:#16a34a;
    color:white;
    width:100%;
}

.locked{
    background:#9ca3af;
    cursor:not-allowed;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    background:#f3f4f6;
    margin:9px 0;
}

.option.selected{
    background:#bfdbfe;
}

.progress{
    height:10px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:#16a34a;
}

.big{
    font-size:30px;
    font-weight:bold;
}

.hide{
    display:none;
}

.requirements{
    line-height:1.7;
}

@media(max-width:450px){

    .dayGrid{
        grid-template-columns:repeat(4,1fr);
    }

    header h1{
        font-size:20px;
    }

}
